# NOTE: Gradle reads this file as ISO-8859-1, so NEVER put non-ASCII characters here.
# Non-ASCII paths are passed via environment variables from _env/build.ps1 instead.

# ---- JVM / toolchain (everything stays on drive D:) ----
org.gradle.java.home=C:/Users/salmon/AppData/Local/Android/jdk17
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# file-system watching uses a native call that the sandbox denies; turn it off
org.gradle.vfs.watch=false
# the Kotlin compile daemon cannot bind its socket here; compile in-process instead
kotlin.compiler.execution.strategy=in-process

# ---- Android ----
# The project folder name contains non-ASCII characters. _env/build.ps1 builds through
# an ASCII junction, and this flag also relaxes AGP's own path check.
android.overridePathCheck=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
