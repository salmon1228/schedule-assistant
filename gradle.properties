# NOTE: Gradle reads this file as ISO-8859-1, so NEVER put non-ASCII characters here.
# Non-ASCII paths are passed via environment variables from _env/build.ps1 instead.

# ---- JVM ----
# 不要在这里写 org.gradle.java.home:那会把某台机器的 JDK 路径带进仓库,
# 别人(和 CI)一编译就报 "Value 'xxx' given for org.gradle.java.home ... is not a valid directory"。
# 本机用 _env/build.ps1 设置 JAVA_HOME;CI 用 actions/setup-java 设置 JAVA_HOME。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# file-system watching uses a native call that the sandbox denies; turn it off
org.gradle.vfs.watch=false
# the Kotlin compile daemon cannot bind its socket here; compile in-process instead
kotlin.compiler.execution.strategy=in-process

# ---- Android ----
# The project folder name may contain non-ASCII characters. _env/build.ps1 builds through
# an ASCII junction, and this flag also relaxes AGP's own path check.
android.overridePathCheck=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
